{% extends 'base.html' %}
{% block title %}Page not found — AllMyProfiles{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="display-1 fw-bold text-primary">404</div>
  <h2 class="fw-bold mb-3">{{ message | default("We couldn't find that page.") }}</h2>
  <p class="text-muted mb-4">The profile or page you're looking for doesn't exist (or maybe it went exploring).</p>
  <a href="{{ url_for('home') }}" class="btn btn-primary rounded-pill px-4">Back to home</a>
</div>
{% endblock %}
